name: Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'New versionName (e.g. 1.1.0). The bump and the tag both use this value.'
        required: true
        type: string
      version_code:
        description: 'New versionCode (integer). Leave empty to auto-increment from the current value.'
        required: false
        type: string
      release_notes:
        description: 'Release notes (Markdown). Leave empty to generate them from commit history.'
        required: false
        type: string
      prerelease:
        description: 'Mark this release as a pre-release.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Metadata repository the Xposed module manager reads.
  LSP_REPOSITORY: Xposed-Modules-Repo/com.github.rove24.assistrestore

jobs:
  release:
    name: Build, tag and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate inputs
        id: validate
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version_name must follow MAJOR.MINOR.PATCH (optionally -suffix). Got: $INPUT_VERSION_NAME"
            exit 1
          fi
          if [[ -n "$INPUT_VERSION_CODE" && ! "$INPUT_VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::version_code must be a non-negative integer. Got: $INPUT_VERSION_CODE"
            exit 1
          fi
          TAG="v${INPUT_VERSION_NAME}"
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists locally."
            exit 1
          fi
          if git ls-remote --tags --exit-code origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists on origin."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Read current version and compute the next versionCode
        id: current
        run: |
          set -euo pipefail
          CURRENT_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          CURRENT_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          echo "Current versionName=${CURRENT_NAME}, versionCode=${CURRENT_CODE}"

          NEW_NAME="${{ inputs.version_name }}"
          NEW_CODE="${{ inputs.version_code }}"
          if [[ -z "$NEW_CODE" ]]; then
            NEW_CODE=$((CURRENT_CODE + 1))
          fi
          if (( NEW_CODE <= CURRENT_CODE )); then
            echo "::error::New versionCode ($NEW_CODE) must be greater than current ($CURRENT_CODE)."
            exit 1
          fi

          echo "current_name=${CURRENT_NAME}" >> "$GITHUB_OUTPUT"
          echo "current_code=${CURRENT_CODE}" >> "$GITHUB_OUTPUT"
          echo "new_name=${NEW_NAME}" >> "$GITHUB_OUTPUT"
          echo "new_code=${NEW_CODE}" >> "$GITHUB_OUTPUT"

      - name: Bump version in app/build.gradle.kts
        run: |
          set -euo pipefail
          NEW_NAME="${{ steps.current.outputs.new_name }}"
          NEW_CODE="${{ steps.current.outputs.new_code }}"
          sed -i -E "s/(versionCode\s*=\s*)[0-9]+/\1${NEW_CODE}/" app/build.gradle.kts
          sed -i -E "s/(versionName\s*=\s*\")[^\"]+/\1${NEW_NAME}/" app/build.gradle.kts
          echo "After bump:"
          grep -E 'versionCode|versionName' app/build.gradle.kts

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        # The ubuntu runner image already ships the Android SDK and exports ANDROID_HOME /
        # ANDROID_SDK_ROOT. android-actions/setup-android installs the legacy "tools" package,
        # which Google removed from the SDK repository, so that action now fails this job; it also
        # used to put the SDK tools on PATH, which this step does instead.
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK not found at $SDK"
            exit 1
          fi
          if [ -d "$SDK/cmdline-tools/latest/bin" ]; then
            CMDLINE_TOOLS="$SDK/cmdline-tools/latest/bin"
          else
            CMDLINE_TOOLS="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | sort -V | tail -n1 || true)"
          fi
          if [ -z "$CMDLINE_TOOLS" ]; then
            echo "::error::No cmdline-tools found under $SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$CMDLINE_TOOLS" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "Using Android SDK: $SDK (tools: $CMDLINE_TOOLS)"
          "$CMDLINE_TOOLS/sdkmanager" --version

      - name: Install required SDK packages
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;36.1.0" \
            || sdkmanager --install "platforms;android-37" "build-tools;36.1.0" \
            || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Check LSP mirror availability
        id: lsp
        env:
          LSP_TOKEN: ${{ secrets.LSP_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$LSP_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::LSP_REPO_TOKEN is not set; the Xposed-Modules-Repo mirror release will be skipped."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 || secrets.SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD || secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$KEYSTORE_BASE64" ] || missing+=("SIGNING_KEYSTORE_BASE64")
          [ -n "$STORE_PASSWORD" ] || missing+=("SIGNING_STORE_PASSWORD")
          [ -n "$KEY_ALIAS" ] || missing+=("SIGNING_KEY_ALIAS")
          [ -n "$KEY_PASSWORD" ] || missing+=("SIGNING_KEY_PASSWORD")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing signing secret(s): ${missing[*]}"
            echo "::error::Set SIGNING_KEYSTORE_BASE64 / SIGNING_STORE_PASSWORD / SIGNING_KEY_ALIAS / SIGNING_KEY_PASSWORD, or the KEY_STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD / SIGNING_KEY variant."
            exit 1
          fi
          KEYSTORE_PATH="${{ runner.temp }}/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "keystore_path=${KEYSTORE_PATH}" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD || secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace \
            -Prelease.storeFile="${KEYSTORE_PATH}" \
            -Prelease.storePassword="${STORE_PASSWORD}" \
            -Prelease.keyAlias="${KEY_ALIAS}" \
            -Prelease.keyPassword="${KEY_PASSWORD}"

      - name: Verify release APK signature
        run: |
          set -euo pipefail
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$RELEASE_APK"

      - name: Stage release APK
        id: stage
        run: |
          set -euo pipefail
          mkdir -p artifacts
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          OUT="artifacts/AssistRestore_v${{ steps.current.outputs.new_name }}.apk"
          cp "$RELEASE_APK" "$OUT"
          sha256sum "$OUT" | tee "${OUT}.sha256"
          echo "release_apk=${OUT}" >> "$GITHUB_OUTPUT"
          echo "release_sha=${OUT}.sha256" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        env:
          USER_NOTES: ${{ inputs.release_notes }}
          PREV_NAME: ${{ steps.current.outputs.current_name }}
          NEW_NAME: ${{ steps.current.outputs.new_name }}
          NEW_CODE: ${{ steps.current.outputs.new_code }}
        run: |
          set -euo pipefail
          NOTES_FILE="${{ runner.temp }}/release_notes.md"
          {
            echo "## ColorOS 唤语 v${NEW_NAME} (versionCode ${NEW_CODE})"
            echo
            echo "在 ColorOS 国内版上还原 AOSP 数字助理行为：长按电源键、长按手势条、底角内滑各自独立唤醒所选助理。"
            echo
            if [[ -n "${USER_NOTES}" ]]; then
              echo "${USER_NOTES}"
              echo
            fi
            echo "### Changes since v${PREV_NAME}"
            echo
            PREV_TAG="v${PREV_NAME}"
            if git rev-parse "${PREV_TAG}" >/dev/null 2>&1; then
              git log --pretty=format:'- %s (%h)' "${PREV_TAG}..HEAD" | grep -v '^- chore(release):' || true
            else
              echo "_No previous tag '${PREV_TAG}' found; listing the most recent 30 commits._"
              echo
              git log --pretty=format:'- %s (%h)' -n 30 | grep -v '^- chore(release):' || true
            fi
            echo
            echo
            echo "### Requirements"
            echo
            echo "ColorOS 国内版固件，KernelSU 或 Magisk，LSPosed 等 libxposed API 102 框架。作用域需勾选 system、com.android.systemui、com.android.launcher、com.google.android.googlequicksearchbox。"
            echo
            echo "### Verification"
            echo
            echo '```'
            APK_NAME="AssistRestore_v${NEW_NAME}.apk"
            SHA=$(awk '{print $1}' "${{ steps.stage.outputs.release_sha }}")
            echo "${APK_NAME}"
            echo "sha256: ${SHA}"
            echo '```'
          } > "${NOTES_FILE}"
          echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"
          echo "----- generated release notes -----"
          cat "${NOTES_FILE}"

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit version bump and tag
        run: |
          set -euo pipefail
          NEW_NAME="${{ steps.current.outputs.new_name }}"
          NEW_CODE="${{ steps.current.outputs.new_code }}"
          TAG="${{ steps.validate.outputs.tag }}"
          git add app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "::error::No version change detected in app/build.gradle.kts."
            exit 1
          fi
          git commit -m "chore(release): v${NEW_NAME} (versionCode ${NEW_CODE}) [skip ci]"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin HEAD
          git push origin "${TAG}"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssistRestore-release-v${{ steps.current.outputs.new_name }}
          path: |
            ${{ steps.stage.outputs.release_apk }}
            ${{ steps.stage.outputs.release_sha }}
          if-no-files-found: error

      - name: Upload mapping file
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mapping-v${{ steps.current.outputs.new_name }}
          path: app/build/outputs/mapping/release/
          if-no-files-found: ignore

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.validate.outputs.tag }}
          name: ${{ steps.validate.outputs.tag }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          draft: false
          prerelease: ${{ inputs.prerelease }}
          files: |
            ${{ steps.stage.outputs.release_apk }}
            ${{ steps.stage.outputs.release_sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish LSP mirror release
        if: steps.lsp.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.LSP_REPO_TOKEN }}
        run: |
          set -euo pipefail
          # Xposed-Modules-Repo requires the release tag to be "<versionCode>-<versionName>".
          LSP_TAG="${{ steps.current.outputs.new_code }}-${{ steps.current.outputs.new_name }}"
          if gh release view "${LSP_TAG}" --repo "${LSP_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::LSP release ${LSP_TAG} already exists; refusing to overwrite published assets."
            exit 1
          fi
          # The mirror Release has to point at a commit in the metadata repository, so create the
          # tag there first and let --verify-tag pick it up.
          if ! gh api "repos/${LSP_REPOSITORY}/git/ref/tags/${LSP_TAG}" >/dev/null 2>&1; then
            TARGET="$(gh api "repos/${LSP_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            gh api --method POST "repos/${LSP_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${LSP_TAG}" -f "sha=${TARGET}" >/dev/null
          fi
          gh release create "${LSP_TAG}" \
            "${{ steps.stage.outputs.release_apk }}" \
            "${{ steps.stage.outputs.release_sha }}" \
            --repo "${LSP_REPOSITORY}" \
            --verify-tag \
            --title "ColorOS 唤语 ${LSP_TAG}" \
            --notes-file "${{ steps.notes.outputs.notes_file }}"

      - name: Verify LSP mirror assets
        if: steps.lsp.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.LSP_REPO_TOKEN }}
        run: |
          set -euo pipefail
          LSP_TAG="${{ steps.current.outputs.new_code }}-${{ steps.current.outputs.new_name }}"
          mkdir -p "$RUNNER_TEMP/lsp-verify"
          gh release download "${LSP_TAG}" --repo "${LSP_REPOSITORY}" \
            -p '*.sha256' -D "$RUNNER_TEMP/lsp-verify"
          mirrored="$(awk '{print $1}' "$RUNNER_TEMP/lsp-verify"/*.sha256)"
          local_sum="$(awk '{print $1}' "${{ steps.stage.outputs.release_sha }}")"
          test "${mirrored}" = "${local_sum}"
          echo "mirrored sha256 verified: ${mirrored}"

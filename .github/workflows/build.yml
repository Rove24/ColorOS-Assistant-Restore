name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        # The ubuntu runner image already ships the Android SDK and exports ANDROID_HOME /
        # ANDROID_SDK_ROOT. android-actions/setup-android installs the legacy "tools" package,
        # which Google removed from the SDK repository, so that action now fails this job; it also
        # used to put the SDK tools on PATH, which this step does instead.
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK not found at $SDK"
            exit 1
          fi
          if [ -d "$SDK/cmdline-tools/latest/bin" ]; then
            CMDLINE_TOOLS="$SDK/cmdline-tools/latest/bin"
          else
            CMDLINE_TOOLS="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | sort -V | tail -n1 || true)"
          fi
          if [ -z "$CMDLINE_TOOLS" ]; then
            echo "::error::No cmdline-tools found under $SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$CMDLINE_TOOLS" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "Using Android SDK: $SDK (tools: $CMDLINE_TOOLS)"
          "$CMDLINE_TOOLS/sdkmanager" --version

      - name: Install required SDK packages
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;36.1.0" \
            || sdkmanager --install "platforms;android-37" "build-tools;36.1.0" \
            || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Read version info
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Building ColorOS AssistRestore v${VERSION_NAME} (${VERSION_CODE})"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 || secrets.SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD || secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::Release signing secrets are not configured; the release APK will be unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYSTORE_PATH="${{ runner.temp }}/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          echo "keystore_path=${KEYSTORE_PATH}" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD || secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_PATH:-}" ]; then
            ./gradlew :app:assembleRelease --stacktrace \
              -Prelease.storeFile="${KEYSTORE_PATH}" \
              -Prelease.storePassword="${STORE_PASSWORD}" \
              -Prelease.keyAlias="${KEY_ALIAS}" \
              -Prelease.keyPassword="${KEY_PASSWORD}"
          else
            ./gradlew :app:assembleRelease --stacktrace
          fi

      - name: Verify release APK signature
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$RELEASE_APK"

      - name: Stage artifacts
        id: stage
        run: |
          set -euo pipefail
          mkdir -p artifacts
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          DEBUG_OUT="artifacts/AssistRestore_v${VERSION_NAME}-debug.apk"
          RELEASE_OUT="artifacts/AssistRestore_v${VERSION_NAME}.apk"
          cp "$DEBUG_APK" "$DEBUG_OUT"
          cp "$RELEASE_APK" "$RELEASE_OUT"
          sha256sum "$RELEASE_OUT" | tee "${RELEASE_OUT}.sha256"
          echo "debug_apk=${DEBUG_OUT}" >> "$GITHUB_OUTPUT"
          echo "release_apk=${RELEASE_OUT}" >> "$GITHUB_OUTPUT"
          echo "release_sha=${RELEASE_OUT}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AssistRestore-debug-v${{ steps.version.outputs.version_name }}
          path: ${{ steps.stage.outputs.debug_apk }}
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: AssistRestore-release-v${{ steps.version.outputs.version_name }}
          path: |
            ${{ steps.stage.outputs.release_apk }}
            ${{ steps.stage.outputs.release_sha }}
          if-no-files-found: error

      - name: Upload mapping file
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mapping-v${{ steps.version.outputs.version_name }}
          path: app/build/outputs/mapping/release/
          if-no-files-found: ignore
